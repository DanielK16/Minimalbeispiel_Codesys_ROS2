############# Servo Node Config ###############################

# Servo Node für myCobot
servo_node:
  start_servo_service: '/servo_node/start_servo'
  stop_servo_service: '/servo_node/stop_servo'
  delta_joint_cmd_topic: '/servo_node/delta_joint_cmds'
  delta_tcp_cmd_topic: '/servo_node/delta_twist_cmds'
  status_topic: '/servo_node/status'
  servo_base: 'g_base'  

