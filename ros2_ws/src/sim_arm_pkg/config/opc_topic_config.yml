########## OPC UA Config #############################

OPC_Client:
  ipaddress: "172.25.170.32"
  port: "4840"

########## Joint State Names ########################

# Joint State Names für myCobot (topic: /joint_states)
joint_states:
  axis_0: joint2_to_joint1            
  axis_1: joint3_to_joint2
  axis_2: joint4_to_joint3
  axis_3: joint5_to_joint4
  axis_4: joint6_to_joint5
  axis_5: joint6output_to_joint6

