arm_group:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.3
  kinematics_solver_attempts: 5
  mode: local # "local" für reinen Gradient Descent, "global" aktiviert zusätzlich den evolutionären Bio-IK 
  stop_optimization_on_valid_solution: true
  position_scale: 1.0
  rotation_scale: 0.2   
  position_threshold: 0.003    # in meter 
  orientation_threshold: 0.08 #in radian
  cost_threshold: 0.001   
  minimal_displacement_weight: 0.00
  gd_step_size: 0.0001

